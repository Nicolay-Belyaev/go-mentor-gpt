services:
  app:
    build: .
    container_name: go-mentor
    environment:
      API_TOKEN: ${API_TOKEN}
    volumes:
      - ./data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    container_name: go-mentor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: